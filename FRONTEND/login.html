<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Artisian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- ! Navbar -->
    <div id="navbar"></div>

    <main class="login-page">
        <div class="login-container">
            <div class="login-art-section">
                <div class="art-overlay"></div>
                <div class="art-content">
                    <div class="art-icon">
                        <i class="fa-solid fa-palette"></i>
                    </div>
                    <h1>Welcome to Artisian</h1>
                    <p>Discover beautiful paintings and bring timeless artwork into your space.</p>
                    <div class="art-line"></div>

                    <span>
                        <i class="fa-solid fa-star"></i>
                        Art • Culture • Expression
                        <i class="fa-solid fa-star"></i>
                    </span>
                </div>
            </div>

            <div class="login-form-section">
                <div class="login-form-container">
                    <div class="login-heading">
                        <div class="heading-icon">
                            <i class="fa-solid fa-right-to-bracket"></i>
                        </div>
                        <h2>Sign In</h2>
                        <p>Login to continue exploring Artisian.</p>
                    </div>

                    <form id="loginForm">

                        <div class="form-group">
                            <label for="email"><i class="fa-solid fa-envelope"></i>Email Address</label>
                            <div class="input-box">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
                            </div>
                            <span class="field-error" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password"><i class="fa-solid fa-lock"></i>Password</label>
                            <div class="input-box">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                                <button type="button" id="togglePassword" class="password-toggle" title="Show password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <span class="field-error" id="passwordError"></span>
                        </div>

                        <div id="loginMessage" class="login-message"></div>

                        <button type="submit" id="loginButton" class="login-button">
                            <span id="loginButtonText">Sign In</span>
                            <i id="loginButtonIcon" class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>

                    <div class="signup-link">
                        <span>Don't have an account?</span>
                        <a href="signup.html">
                            Create Account
                            <i class="fa-solid fa-user-plus"></i>
                        </a>
                    </div>

                    <a href="index.html" class="back-home">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to Artisian
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- ! Footer -->
    <div id="page-footer"></div>

    <script src="./js/jquery-3.6.0.js"></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
