<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Artisian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <main class="signup-page">

        <div class="signup-container">
            <div class="signup-art-section">
                <div class="art-overlay"></div>
                <div class="art-content">
                    <div class="art-icon">
                        <i class="fa-solid fa-palette"></i>
                    </div>
                    <h1>Join Artisian</h1>
                    <p>Create your account and discover beautiful paintings crafted with creativity and tradition.</p>
                    <div class="art-line"></div>
                    <div class="art-features">
                        <div>
                            <i class="fa-solid fa-gem"></i>
                            <span>Beautiful Artwork</span>
                        </div>
                        <div>
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>Secure Account</span>
                        </div>
                        <div>
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span>Easy Shopping</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="signup-form-section">
                <div class="signup-form-container">
                    <div class="signup-heading">
                        <div class="heading-icon">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <h2>Create Account</h2>
                        <p>Register to start shopping at Artisian.</p>
                    </div>

                    <form id="signupForm">
                        <div class="form-group">
                            <label for="fullName"><i class="fa-solid fa-user"></i>Full Name</label>

                            <div class="input-box">
                                <i class="fa-solid fa-user"></i>
                                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name" required>
                            </div>
                            <span class="field-error" id="fullNameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="email"><i class="fa-solid fa-envelope"></i>Email Address</label>

                            <div class="input-box">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
                            </div>
                            <span class="field-error" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password"><i class="fa-solid fa-lock"></i>Password</label>

                            <div class="input-box">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                                <button type="button" id="togglePassword" class="password-toggle" title="Show password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <span class="field-error" id="passwordError"></span>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword"><i class="fa-solid fa-lock"></i>Confirm Password</label>

                            <div class="input-box">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
                                <button type="button" id="toggleConfirmPassword" class="password-toggle" title="Show password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <span class="field-error" id="confirmPasswordError"></span>
                        </div>

                        <div id="signupMessage" class="signup-message">
                        </div>

                        <button type="submit" id="signupButton" class="signup-button">
                            <span id="signupButtonText">Create Account</span>
                            <i id="signupButtonIcon" class="fa-solid fa-user-plus"></i>
                        </button>
                    </form>

                    <div class="login-link">
                        <span>Already have an account?</span>
                        <a href="login.html">
                            Sign In
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>

                    <!-- <a href="index.html" class="back-home">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to Artisian
                    </a> -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="page-footer"></div>

    <script src="./js/jquery-3.6.0.js"></script>
    <script src="js/common.js"></script>
    <script src="js/signup.js"></script>

</body>
</html>
