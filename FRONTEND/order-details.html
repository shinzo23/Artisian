<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisian</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/order-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="./js/jquery-3.6.0.js"></script>
</head>
<body>

    <div id="navbar"></div>

    <main class="order-details-page">
        <div class="order-details-container">
            <div class="order-details-heading">
                <a href="orders.html" class="back-orders">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to My Orders
                </a>
                <span class="section-label">ARTISIAN ORDER</span>
                <h1>Order Details</h1>
                <p id="orderNumberText">Loading order...</p>
            </div>

            <div id="orderDetailsMessage"
                 class="order-details-message">
            </div>

            <div id="orderDetailsContainer">
                <div class="order-details-loading">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <span>Loading order details...</span>
                </div>
            </div>
        </div>
    </main>

    <div id="page-footer"></div>

    <script src="./js/jquery-3.6.0.js"></script>
    <script src="./js/fetchNavFooter.js"></script>
    <script src="js/common.js"></script>
    <script src="js/order-details.js"></script>

</body>
</html>
